version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dar-med-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: dar
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dar-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: dar-med-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD:
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dar-network

volumes:
  mysql_data:

networks:
  dar-network:
    driver: bridge
